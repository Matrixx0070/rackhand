name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get install -y openssh-server openssh-client   # a real sshd for the post-quantum tests
      - run: npm ci
      - run: npm run typecheck
      - run: bash -n install.sh box.sh upgrade/deploy.sh upgrade/rehearse.sh
      - run: npm test
